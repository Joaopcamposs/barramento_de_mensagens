services:
  postgres_test:
    image: postgres:16
    container_name: barramento_postgres_test
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "54323:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - test_network

networks:
  test_network:
    name: barramento_test_network
