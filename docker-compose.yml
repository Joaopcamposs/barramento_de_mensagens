services:
  api:
    build:
      context: .
    container_name: barramento_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - IN_DOCKER=true
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/postgres

  postgres:
    image: postgres:16
    container_name: barramento_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
